<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ventilator Visual Prop</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#eaf3fa;background:#071420}*{box-sizing:border-box}body{margin:0;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:23px;margin:0;font-weight:600}small{color:#9eb3c2}.pill{border:1px solid #365269;border-radius:9px;padding:9px 14px;color:#a8cce4}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.panel{background:#102438;border:1px solid #34536a;border-radius:12px;padding:16px}.wave{height:145px;border-bottom:1px solid #29485b;position:relative;padding:10px 0}.wave:last-child{border-bottom:0}.wave label{position:absolute;left:10px;top:8px;font-weight:700;font-size:13px;z-index:1}.wave canvas{width:100%;height:100%;display:block}.wave.pressure{color:#e6d366}.wave.flow{color:#70d2bd}.wave.volume{color:#76b8f2}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{background:#172f45;border:1px solid #3d6077;border-radius:10px;padding:13px;text-align:center}.setting label{display:block;font-size:15px;color:#b9d3e3}.value{font-size:37px;font-weight:700;margin:10px 0}.unit{font-size:14px;color:#a6c4d6}.controls{display:flex;gap:8px}.controls button{flex:1;font-size:26px;font-weight:700;padding:9px 0;background:#275b7d;color:white;border:1px solid #568ca9;border-radius:8px;cursor:pointer}.controls button:active{background:#3c87ad}.metric .mini{display:flex;justify-content:center;gap:6px;margin-top:7px}.metric .mini button{background:#275b7d;color:white;border:1px solid #568ca9;border-radius:5px;min-width:35px;font-size:18px;cursor:pointer}.metric.alarm{border:1px solid #e5a048;border-radius:8px;background:#4a2c1c}.metric.alarm strong{color:#ffd080}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric{text-align:center;padding:12px 8px}.metric span{display:block;color:#9fc3d8;font-size:14px}.metric strong{font-size:26px;color:#e4f2fb}footer{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#8eabbc;font-size:12px}button.reset{background:transparent;border:1px solid #42677d;border-radius:7px;color:#bad3e3;padding:9px 12px;cursor:pointer}@media(max-width:850px){.layout{grid-template-columns:1fr}.settings{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.settings{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.value{font-size:30px}body{padding:10px}}
</style></head><body><header><div><h1>VENTILATOR <small> · Visual Training Display</small></h1></div><div class="pill">VC–AC &nbsp; | &nbsp; ADULT</div></header><div class="layout"><section class="panel"><div class="wave pressure"><label>PRESSURE · cmH₂O</label><canvas id="pressure"></canvas></div><div class="wave flow"><label>FLOW · L/min</label><canvas id="flow"></canvas></div><div class="wave volume"><label>VOLUME · mL</label><canvas id="volume"></canvas></div></section><section class="panel"><h2 style="font-size:16px;margin:0 0 14px;color:#bcd6e5">VENTILATOR SETTINGS</h2><div class="settings" id="settings"></div></section></div><section class="panel metrics"><div class="metric"><span>Ppeak · cmH₂O</span><strong id="peak">28</strong><div class="mini"><button data-reading="peak" data-delta="-1" aria-label="Decrease peak pressure">−</button><button data-reading="peak" data-delta="1" aria-label="Increase peak pressure">+</button></div><span id="peakalarm" style="display:none;color:#ffd080;font-weight:bold;margin-top:5px">HIGH PRESSURE</span></div><div class="metric"><span>Plateau · cmH₂O</span><strong id="plateau">28</strong><div class="mini"><button data-reading="plateau" data-delta="-1" aria-label="Decrease plateau pressure">−</button><button data-reading="plateau" data-delta="1" aria-label="Increase plateau pressure">+</button></div></div><div class="metric"><span>VTe · mL</span><strong id="vte">320</strong></div><div class="metric"><span>Minute Vent · L/min</span><strong id="minute">7.7</strong></div><div class="metric"><span>Total RR · /min</span><strong id="totalrr">24</strong></div></section><footer><span>SIMULATION PROP ONLY · Not for clinical use</span><button class="reset" id="reset">Reset to baseline</button></footer><script>
const defaults={fio2:60,peep:10,vt:320,rr:24};const values={...defaults};const readings={peak:28,plateau:28};const configs=[{id:'fio2',name:'FiO₂',unit:'%',step:5,min:21,max:100},{id:'peep',name:'PEEP',unit:'cmH₂O',step:1,min:0,max:25},{id:'vt',name:'Tidal Volume',unit:'mL',step:10,min:100,max:900},{id:'rr',name:'Set Rate',unit:'/min',step:1,min:5,max:40}];const settings=document.getElementById('settings');for(const c of configs){const div=document.createElement('div');div.className='setting';div.innerHTML=`<label>${c.name}</label><div class="value"><span id="${c.id}"></span><span class="unit"> ${c.unit}</span></div><div class="controls"><button aria-label="Decrease ${c.name}" data-id="${c.id}" data-delta="-1">−</button><button aria-label="Increase ${c.name}" data-id="${c.id}" data-delta="1">+</button></div>`;settings.appendChild(div)}function refresh(){for(const c of configs)document.getElementById(c.id).textContent=values[c.id];document.getElementById('peak').textContent=readings.peak;document.getElementById('plateau').textContent=readings.plateau;document.getElementById('peakalarm').style.display=readings.peak>=42?'block':'none';document.getElementById('peak').closest('.metric').classList.toggle('alarm',readings.peak>=42);document.getElementById('vte').textContent=values.vt;document.getElementById('minute').textContent=(values.vt*values.rr/1000).toFixed(1);document.getElementById('totalrr').textContent=values.rr}settings.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const c=configs.find(x=>x.id===b.dataset.id);values[c.id]=Math.max(c.min,Math.min(c.max,values[c.id]+Number(b.dataset.delta)*c.step));refresh()});document.querySelector('.metrics').addEventListener('click',e=>{const b=e.target.closest('button[data-reading]');if(!b)return;const id=b.dataset.reading;readings[id]=Math.max(0,Math.min(80,readings[id]+Number(b.dataset.delta)));refresh()});document.getElementById('reset').onclick=()=>{Object.assign(values,defaults);Object.assign(readings,{peak:28,plateau:28});refresh()};refresh();
const canvases=[['pressure','#e6d366'],['flow','#70d2bd'],['volume','#76b8f2']].map(([id,color])=>({canvas:document.getElementById(id),color,id}));function shape(id,phase){const p=phase%1;if(id==='pressure')return p<.32?(.14+.75*Math.min(1,p/.045)):(p<.38?.14+.75*(.38-p)/.06:.14);if(id==='flow')return p<.32?.86-.38*p/.32:p<.65?.20-.38*Math.sin(Math.PI*(p-.32)/.33):.2;return p<.32?.12+.77*p/.32:p<.68?.89-.77*(p-.32)/.36:.12}function draw(t){for(const {canvas,color,id} of canvases){const rect=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const w=Math.max(1,Math.floor(rect.width*dpr)),h=Math.max(1,Math.floor(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);ctx.strokeStyle='#28465a';ctx.lineWidth=1;for(let x=0;x<w;x+=Math.round(45*dpr)){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=Math.round(35*dpr)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle=color;ctx.lineWidth=2.5*dpr;ctx.beginPath();const cycles=4;for(let x=0;x<w;x+=2){const phase=x/w*cycles+t/1000*values.rr/60;const y=(1-shape(id,phase))*(h*.72)+h*.12;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
